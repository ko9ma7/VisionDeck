<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020">
  <title>404 — VisionDeck</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0f17;color:#eef3f8;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(560px,100%);padding:34px;border:1px solid #263142;border-radius:16px;background:#111925;box-shadow:0 24px 70px rgba(0,0,0,.32)}.mark{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:rgba(97,227,177,.12);color:#61e3b1;font-weight:900}h1{margin:24px 0 8px;font-size:28px}p{color:#8b99ab;line-height:1.6}.actions{display:flex;gap:8px;margin-top:24px}button,a{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #34435a;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;background:#151d2a;color:#eef3f8}.primary{background:#61e3b1;border-color:#61e3b1;color:#06100c}
  </style>
</head>
<body><main class="card"><div class="mark">VD</div><h1>페이지를 찾을 수 없습니다.</h1><p>주소가 변경되었거나 존재하지 않는 경로입니다. VisionDeck 워크스페이스로 돌아가거나 이전 페이지로 이동하세요.</p><div class="actions"><a id="home" class="primary" href="/">홈으로</a><button onclick="history.back()">이전 페이지</button></div></main><script>const h=document.getElementById('home');const onGh=location.hostname.endsWith('github.io');h.href=onGh?('/'+location.pathname.split('/').filter(Boolean)[0]+'/'):'/'</script></body>
</html>
